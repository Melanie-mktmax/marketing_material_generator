/* ───────────────────────── Parsing & rendering ───────────────────────── */

const HEADER_RE = /^##\s*\[(\d)\]\s*([^\n]*)$/gm;

function parseSections(raw, finished) {
  const out = TABS.map(() => ({ started: false, body: '', complete: false }));
  if (!raw) return out;
  const heads = [];
  HEADER_RE.lastIndex = 0;
  let m;
  while ((m = HEADER_RE.exec(raw))) heads.push({ idx: parseInt(m[1], 10) - 1, start: m.index, end: m.index + m[0].length });
  heads.forEach((h, i) => {
    if (h.idx < 0 || h.idx >= TABS.length) return;
    const next = heads[i + 1];
    const body = raw.slice(h.end, next ? next.start : raw.length).trim();
    out[h.idx] = { started: true, body, complete: !!next || finished };
  });
  return out;
}

function applyEdits(sections, edits) {
  return sections.map((s, i) => (typeof edits[i] === 'string' ? { ...s, body: edits[i], edited: true } : s));
}

function joinSections(sections) {
  return sections.map((s, i) => (s.started ? `${HEADER_LINES[i]}\n\n${s.body}` : '')).filter(Boolean).join('\n\n');
}

function toBlocks(body) {
  const blocks = [];
  let para = [];
  let list = null;
  const flushPara = () => { if (para.length) { blocks.push({ type: 'p', lines: para }); para = []; } };
  const flushList = () => { if (list) { blocks.push(list); list = null; } };
  for (const rawLine of body.split('\n')) {
    const t = rawLine.trim();
    if (!t) { flushPara(); flushList(); continue; }
    let m;
    const t2 = t.replace(/^[-*•]\s+(?=#{1,6}\s)/, ''); // tolerate "- ### Heading" (a bulleted heading)
    if ((m = t2.match(/^#{1,6}\s+(.*)$/))) { flushPara(); flushList(); blocks.push({ type: 'h', text: m[1] }); continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flushPara(); flushList(); blocks.push({ type: 'hr' }); continue; }
    if ((m = t.match(/^[-*•]\s+(.*)$/))) {
      flushPara();
      if (!list || list.type !== 'ul') { flushList(); list = { type: 'ul', items: [] }; }
      list.items.push(m[1]); continue;
    }
    if ((m = t.match(/^\d+[.)]\s+(.*)$/))) {
      flushPara();
      if (!list || list.type !== 'ol') { flushList(); list = { type: 'ol', items: [] }; }
      list.items.push(m[1]); continue;
    }
    flushList();
    para.push(t.replace(/^>\s?/, ''));
  }
  flushPara(); flushList();
  return blocks;
}

// Bold may contain a single '*' (e.g. footnote markers); a lone '*' glued to a digit/percent is a footnote, not emphasis.
const INLINE_RE = /(\*\*(?!\s)[^\n]+?(?<!\s)\*\*(?![\p{L}\p{N}])|(?<![\p{L}\p{N}%])\*(?!\s)[^*\n]+?(?<!\s)\*(?![\p{L}\p{N}])|\[[^\]\n]+?\])/gu;
const INLINE_TAG_RE = /(\*\*(?!\s)[^\n]+?(?<!\s)\*\*(?![\p{L}\p{N}])|(?<![\p{L}\p{N}%])\*(?!\s)[^*\n]+?(?<!\s)\*(?![\p{L}\p{N}])|\[[^\]\n]+?\]|#[\p{L}\p{N}_]+)/gu;

function Inline({ text, hashtags }) {
  const re = hashtags ? INLINE_TAG_RE : INLINE_RE;
  const parts = [];
  let last = 0, m, k = 0;
  re.lastIndex = 0;
  while ((m = re.exec(text))) {
    if (m.index > last) parts.push(text.slice(last, m.index));
    const tok = m[0];
    if (tok.startsWith('**')) parts.push(<strong key={k++}>{tok.slice(2, -2)}</strong>);
    else if (tok.startsWith('*')) parts.push(<em key={k++}>{tok.slice(1, -1)}</em>);
    else if (tok.startsWith('[')) parts.push(<span key={k++} className="ph">{tok}</span>);
    else parts.push(<span key={k++} className="tag">{tok}</span>);
    last = m.index + tok.length;
  }
  if (last < text.length) parts.push(text.slice(last));
  return <>{parts}</>;
}

function CopyBody({ body, hashtags, streaming, lang }) {
  const blocks = useMemo(() => toBlocks(body), [body]);
  return (
    <div className={`copy ${streaming ? 'caret' : ''}`} lang={lang}>
      {blocks.map((b, i) => {
        if (b.type === 'h') return <h4 key={i}><Inline text={b.text} hashtags={false} /></h4>;
        if (b.type === 'hr') return <hr key={i} />;
        if (b.type === 'ul' || b.type === 'ol') {
          const Tag = b.type;
          return <Tag key={i}>{b.items.map((it, j) => <li key={j}><Inline text={it} hashtags={hashtags} /></li>)}</Tag>;
        }
        return (
          <p key={i}>
            {b.lines.map((ln, j) => (
              <React.Fragment key={j}>{j > 0 && <br />}<Inline text={ln} hashtags={hashtags} /></React.Fragment>
            ))}
          </p>
        );
      })}
    </div>
  );
}

/* ───────────────────────── Helpers ───────────────────────── */

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

function wordCount(s) { return s ? s.split(/\s+/).filter(Boolean).length : 0; }
function charCount(s) { return s ? s.replace(/\s/g, '').length : 0; }
function lengthLabel(text, lang) {
  return lang === 'ko' ? `${charCount(text).toLocaleString()}자` : `${wordCount(text).toLocaleString()} words`;
}

function loadJSON(key) { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function saveJSON(key, obj) { try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {} }

const EMPTY_JOB = { raw: '', status: 'idle', error: null, truncated: false };

function restoreJob(saved) {
  if (!saved || !saved.raw) return EMPTY_JOB;
  // Only a finished run comes back as 'done'; a stopped or failed run keeps its partial-content semantics.
  return { raw: saved.raw, status: saved.status === 'done' ? 'done' : 'cancelled', error: null, truncated: !!saved.truncated };
}

/* ───────────────────────── Byte budgeting ───────────────────────── */

const ENC = new TextEncoder();
const DEC = new TextDecoder('utf-8', { fatal: false });
function byteLength(s) { return s ? ENC.encode(s).length : 0; }
function truncateBytes(s, maxBytes) {
  if (maxBytes <= 0) return '';
  const bytes = ENC.encode(s);
  if (bytes.length <= maxBytes) return s;
  return DEC.decode(bytes.slice(0, maxBytes)).replace(new RegExp(String.fromCharCode(0xFFFD) + '+$'), ''); // drop a trailing partial code point
}
function fmtBytes(n) { return n < 1024 ? `${n} B` : n < 1024 * 1024 ? `${(n / 1024).toFixed(n < 10240 ? 1 : 0)} KB` : `${(n / 1024 / 1024).toFixed(1)} MB`; }

// Fit file texts into a byte budget: equal shares first, then hand unused share to longer files.
function fitReferences(refs, budget, label = '참고 자료') {
  const ready = refs.filter((r) => r.status === 'ready' && r.text);
  if (!ready.length || budget <= 0) return { block: '', items: refs.map((r) => ({ id: r.id, used: 0 })) };
  const HEADER_ALLOWANCE = 120;
  let remaining = Math.max(0, budget - ready.length * HEADER_ALLOWANCE);
  const alloc = Object.fromEntries(ready.map((r) => [r.id, 0]));
  let pending = ready.slice();
  while (pending.length && remaining > 0) {
    const share = Math.floor(remaining / pending.length);
    if (share <= 0) break;
    const next = [];
    for (const r of pending) {
      const need = r.bytes - alloc[r.id];
      if (need <= share) { alloc[r.id] += need; remaining -= need; }
      else { alloc[r.id] += share; remaining -= share; next.push(r); }
    }
    if (next.length === pending.length && next.every((r) => alloc[r.id] >= r.bytes)) break;
    pending = next;
  }
  const parts = ready.map((r, i) => {
    const text = truncateBytes(r.text, alloc[r.id]);
    const partial = alloc[r.id] < r.bytes;
    return `--- ${label} ${i + 1}: ${r.name} (${r.ext.toUpperCase()}, ${partial ? `${text.replace(/\s/g, '').length.toLocaleString()}자 / 전체 ${r.chars.toLocaleString()}자 중 일부` : `${r.chars.toLocaleString()}자 전체`}) ---\n${text}`;
  });
  return { block: parts.join('\n\n'), items: refs.map((r) => ({ id: r.id, used: alloc[r.id] || 0 })) };
}

/* ───────────────────────── Reference file extraction (all in the browser) ───────────────────────── */

function decodeEntities(s) {
  return s.replace(/&(amp|lt|gt|quot|apos|#x[0-9a-fA-F]+|#\d+);/g, (m, e) => {
    if (e === 'amp') return '&'; if (e === 'lt') return '<'; if (e === 'gt') return '>'; if (e === 'quot') return '"'; if (e === 'apos') return "'";
    const code = e[1] === 'x' || e[1] === 'X' ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
    return Number.isFinite(code) ? String.fromCodePoint(code) : m;
  });
}
// Breaks and tabs are empty elements OUTSIDE the text runs, so turn them into text runs first
// — otherwise the run extractor drops them and words from separate lines get glued together.
function xmlParagraphs(xml, paraTag, textTag, breaks = []) {
  let doc = xml;
  for (const [tag, ch] of breaks) doc = doc.replace(new RegExp(`<${tag}(?:\\s[^>]*)?/>`, 'g'), `<${textTag}>${ch}</${textTag}>`);
  const paras = doc.split(new RegExp(`</${paraTag}>`));
  const tRe = new RegExp(`<${textTag}(?:\\s[^>]*)?>([\\s\\S]*?)</${textTag}>`, 'g');
  const out = [];
  for (const p of paras) {
    const texts = [];
    let m;
    tRe.lastIndex = 0;
    while ((m = tRe.exec(p))) texts.push(decodeEntities(m[1]));
    const line = texts.join('').replace(/[ \t]+\n/g, '\n').trim();
    if (line) out.push(line);
  }
  return out.join('\n');
}
function normalizeText(s) { return s.replace(/\r\n?/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim(); }

async function extractDocx(buf) {
  const zip = await JSZip.loadAsync(buf);
  const doc = zip.file('word/document.xml');
  if (!doc) throw new Error('word/document.xml 없음');
  const xml = await doc.async('string');
  return xmlParagraphs(xml, 'w:p', 'w:t', [['w:br', '\n'], ['w:tab', '\t'], ['w:cr', '\n']]);
}
async function extractPptx(buf) {
  const zip = await JSZip.loadAsync(buf);
  const slides = Object.keys(zip.files).filter((n) => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a, b) => parseInt(a.match(/slide(\d+)/)[1], 10) - parseInt(b.match(/slide(\d+)/)[1], 10));
  if (!slides.length) throw new Error('슬라이드 없음');
  const parts = [];
  for (const name of slides) {
    const xml = await zip.file(name).async('string');
    const text = xmlParagraphs(xml, 'a:p', 'a:t', [['a:br', '\n']]);
    if (text) parts.push(`[슬라이드 ${name.match(/slide(\d+)/)[1]}]\n${text}`);
  }
  return parts.join('\n\n');
}
async function extractXlsx(buf) {
  const zip = await JSZip.loadAsync(buf);
  const shared = [];
  const ss = zip.file('xl/sharedStrings.xml');
  if (ss) {
    const xml = await ss.async('string');
    const siRe = /<si>([\s\S]*?)<\/si>/g;
    let m;
    while ((m = siRe.exec(xml))) {
      const tRe = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g;
      const texts = [];
      let t;
      while ((t = tRe.exec(m[1]))) texts.push(decodeEntities(t[1]));
      shared.push(texts.join(''));
    }
  }
  const sheets = Object.keys(zip.files).filter((n) => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))
    .sort((a, b) => parseInt(a.match(/sheet(\d+)/)[1], 10) - parseInt(b.match(/sheet(\d+)/)[1], 10));
  const parts = [];
  for (const name of sheets) {
    const xml = await zip.file(name).async('string');
    const rows = [];
    const rowRe = /<row(?:\s[^>]*)?>([\s\S]*?)<\/row>/g;
    let r;
    while ((r = rowRe.exec(xml))) {
      const cells = [];
      const cRe = /<c(\s[^>]*)?>([\s\S]*?)<\/c>/g;
      let c;
      while ((c = cRe.exec(r[1]))) {
        const attrs = c[1] || '';
        const inner = c[2];
        const type = (attrs.match(/\bt="([^"]+)"/) || [])[1];
        let v = '';
        if (type === 's') { const idx = parseInt((inner.match(/<v>([^<]*)<\/v>/) || [])[1], 10); v = shared[idx] ?? ''; }
        else if (type === 'inlineStr') { v = decodeEntities((inner.match(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/) || [])[1] || ''); }
        else { v = decodeEntities((inner.match(/<v>([^<]*)<\/v>/) || [])[1] || ''); }
        cells.push(v);
      }
      const line = cells.join('\t').replace(/\t+$/, '');
      if (line.trim()) rows.push(line);
    }
    if (rows.length) parts.push(`[시트 ${name.match(/sheet(\d+)/)[1]}]\n${rows.join('\n')}`);
  }
  if (!parts.length) throw new Error('읽을 수 있는 셀이 없습니다');
  return parts.join('\n\n');
}
async function extractPdf(buf) {
  if (!window.pdfjsLib) throw new Error('PDF 라이브러리를 불러오지 못했습니다');
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const pages = Math.min(pdf.numPages, MAX_PDF_PAGES);
  const parts = [];
  for (let p = 1; p <= pages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    let text = '';
    for (const it of content.items) { text += it.str; if (it.hasEOL) text += '\n'; else if (it.str && !/\s$/.test(it.str)) text += ' '; }
    text = text.replace(/[ \t]+/g, ' ').trim();
    if (text) parts.push(`[p.${p}]\n${text}`);
  }
  if (pdf.numPages > pages) parts.push(`[${pdf.numPages - pages}쪽은 생략됨]`);
  if (!parts.length) throw new Error('텍스트 레이어가 없는 PDF입니다(스캔본이면 이미지로 첨부하세요)');
  return parts.join('\n\n');
}
async function extractText(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (TEXT_EXTS.includes(ext) || file.type.startsWith('text/')) return normalizeText(await file.text());
  const buf = await file.arrayBuffer();
  if (ext === 'docx') return normalizeText(await extractDocx(buf));
  if (ext === 'pptx') return normalizeText(await extractPptx(buf));
  if (ext === 'xlsx') return normalizeText(await extractXlsx(buf));
  if (ext === 'pdf') return normalizeText(await extractPdf(buf));
  throw new Error('지원하지 않는 형식');
}

let refSeq = 0;
function nextRefId() { refSeq += 1; return `r${refSeq}-${Math.random().toString(36).slice(2, 8)}`; }

function useSample() {
  const [state, setState] = useState({ status: 'connecting', fn: null, limits: null });
  useEffect(() => {
    let alive = true;
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { setState({ status: 'unavailable', fn: null, limits: null }); return; }
    c.use('sample')
      .then(async (fn) => {
        if (!alive) return;
        if (!fn) { setState({ status: 'unavailable', fn: null, limits: null }); return; }
        let limits = null;
        try { limits = await fn.limits(); } catch (e) { limits = null; }
        if (alive) setState({ status: 'ready', fn, limits });
      })
      .catch(() => { if (alive) setState({ status: 'unavailable', fn: null, limits: null }); });
    return () => { alive = false; };
  }, []);
  return state;
}

function App() {
  const savedInput = useMemo(() => loadJSON(LS_INPUT_KEY), []);
  const savedOutput = useMemo(() => loadJSON(LS_OUTPUT_KEY), []);

  // Inputs
  const [brandId, setBrandId] = useState(savedInput?.brandId || BRANDS[0].id);
  const [profiles, setProfiles] = useState(() => {
    const base = Object.fromEntries(BRANDS.map((b) => [b.id, { en: b.en, voice: b.voice }]));
    if (savedInput?.profiles) for (const id of Object.keys(base)) if (savedInput.profiles[id]) base[id] = { ...base[id], ...savedInput.profiles[id] };
    return base;
  });
  const [channelId, setChannelId] = useState(savedInput?.channelId || CHANNELS[1].id);
  const [sourceTypeId, setSourceTypeId] = useState(savedInput?.sourceTypeId || SOURCE_TYPES[0].id);
  const [source, setSource] = useState(savedInput?.source || '');
  const [voiceOpen, setVoiceOpen] = useState(false);

  // Reference materials — documents are parsed to text in the browser; images ride along with the Korean generation only.
  const [refs, setRefs] = useState(() => {
    const saved = loadJSON(LS_REFS_KEY);
    return Array.isArray(saved) ? saved.filter((r) => r && r.status === 'ready' && typeof r.text === 'string').map((r) => ({ ...r, id: r.id || nextRefId(), error: null })) : [];
  });
  const [imageRefs, setImageRefs] = useState([]); // { id, name, size, file, origin: 'source' | 'ref' } — session only
  const [dragOver, setDragOver] = useState(null); // 'source' | 'ref'
  const fileInputRef = useRef(null);

  // Source files — uploaded clinical / competitor documents, treated as primary evidence alongside the typed source.
  const [sourceFiles, setSourceFiles] = useState(() => {
    const saved = loadJSON(LS_SRCFILES_KEY);
    return Array.isArray(saved) ? saved.filter((r) => r && r.status === 'ready' && typeof r.text === 'string').map((r) => ({ ...r, id: r.id || nextRefId(), error: null })) : [];
  });
  const sourceInputRef = useRef(null);

  // Outputs — Korean first, English derived from the reviewed Korean.
  const [ko, setKo] = useState(() => restoreJob(savedOutput?.ko));
  const [en, setEn] = useState(() => restoreJob(savedOutput?.en));
  const [edits, setEdits] = useState(() => ({ ko: savedOutput?.edits?.ko || {}, en: savedOutput?.edits?.en || {} }));
  const [stale, setStale] = useState(!!savedOutput?.stale);
  const [snapshot, setSnapshot] = useState(savedOutput?.snapshot || null); // inputs the Korean set was generated from
  const [job, setJob] = useState(null); // null | 'ko' | 'en'
  const [view, setView] = useState(savedOutput?.view === 'en' ? 'en' : 'ko');
  const [active, setActive] = useState(0);
  const [editing, setEditing] = useState(null); // { lang, idx, text, before }
  const [notice, setNotice] = useState(null); // { kind: 'warn' | 'crit', text } — outcome of the last run when nothing was produced
  const pinnedRef = useRef(false);
  const ctlRef = useRef(null);
  const startedRef = useRef(0);
  const textareaRef = useRef(null);

  const sample = useSample();

  const brand = BRANDS.find((b) => b.id === brandId) || BRANDS[0];
  const profile = profiles[brand.id];
  const channel = CHANNELS.find((c) => c.id === channelId) || CHANNELS[0];
  const sourceType = SOURCE_TYPES.find((s) => s.id === sourceTypeId) || SOURCE_TYPES[0];
  const brandFull = { ...brand, ...profile };

  useEffect(() => { saveJSON(LS_INPUT_KEY, { brandId, channelId, sourceTypeId, source, profiles }); }, [brandId, channelId, sourceTypeId, source, profiles]);
  const persistable = (r) => ({ id: r.id, name: r.name, ext: r.ext, size: r.size, text: r.text, chars: r.chars, bytes: r.bytes, status: r.status });
  useEffect(() => { saveJSON(LS_REFS_KEY, refs.filter((r) => r.status === 'ready').map(persistable)); }, [refs]);
  useEffect(() => { saveJSON(LS_SRCFILES_KEY, sourceFiles.filter((r) => r.status === 'ready').map(persistable)); }, [sourceFiles]);
  useEffect(() => {
    if (job) return; // persist settled outputs only
    saveJSON(LS_OUTPUT_KEY, {
      ko: { raw: ko.raw, status: ko.status, truncated: ko.truncated },
      en: { raw: en.raw, status: en.status, truncated: en.truncated },
      edits, stale, snapshot, view,
    });
  }, [job, ko, en, edits, stale, snapshot, view]);
  useEffect(() => () => ctlRef.current?.abort(), []);

  const running = job !== null;
  const koFinished = ko.status === 'done' || ko.status === 'cancelled' || ko.status === 'error';
  const enFinished = en.status === 'done' || en.status === 'cancelled' || en.status === 'error';
  const koReady = ko.status === 'done' || (ko.status === 'cancelled' && !!ko.raw);
  const enReady = en.status === 'done' || (en.status === 'cancelled' && !!en.raw);

  const koGen = useMemo(() => parseSections(ko.raw, koFinished), [ko.raw, koFinished]);
  const enGen = useMemo(() => parseSections(en.raw, enFinished), [en.raw, enFinished]);
  const koSections = useMemo(() => applyEdits(koGen, edits.ko), [koGen, edits.ko]);
  const enSections = useMemo(() => applyEdits(enGen, edits.en), [enGen, edits.en]);
  const sections = view === 'ko' ? koSections : enSections;
  const current = view === 'ko' ? ko : en;
  const viewRunning = job === view;

  const fingerprint = JSON.stringify({
    brandId, channelId, sourceTypeId, source: source.trim(), en: profile.en, voice: profile.voice,
    srcFiles: sourceFiles.filter((r) => r.status === 'ready').map((r) => [r.name, r.bytes]),
    refs: refs.filter((r) => r.status === 'ready').map((r) => [r.name, r.bytes]),
    images: imageRefs.map((im) => [im.name, im.size, im.origin]),
  });
  const inputsChanged = !!snapshot && snapshot.fingerprint !== fingerprint;

  // Follow the section being written unless the reader picked a tab.
  useEffect(() => {
    if (!viewRunning || pinnedRef.current) return;
    let last = -1;
    sections.forEach((s, i) => { if (s.started) last = i; });
    if (last >= 0 && last !== active) setActive(last);
  }, [sections, viewRunning, active]);

  const sourceBytes = useMemo(() => byteLength(source), [source]);
  const imageLimits = (sample.limits && sample.limits.images) || null;
  const acceptList = imageLimits ? `${REF_ACCEPT},${imageLimits.mediaTypes.join(',')}` : REF_ACCEPT;
  const parsing = refs.some((r) => r.status === 'parsing') || sourceFiles.some((r) => r.status === 'parsing');
  const readyRefs = refs.filter((r) => r.status === 'ready');
  const readySourceFiles = sourceFiles.filter((r) => r.status === 'ready');
  const sourceImages = imageRefs.filter((im) => im.origin === 'source');

  // Uploaded source documents are primary evidence, so they claim the source budget before references get theirs.
  const srcFit = useMemo(
    () => fitReferences(sourceFiles, Math.max(0, MAX_SOURCE_BYTES - sourceBytes), '첨부 원천 자료'),
    [sourceFiles, sourceBytes],
  );
  const srcUsedById = Object.fromEntries(srcFit.items.map((i) => [i.id, i.used]));
  const sourceTotalBytes = sourceBytes + byteLength(srcFit.block);
  const hasSource = source.trim().length > 0 || readySourceFiles.length > 0;
  const sourceOk = hasSource && sourceBytes <= MAX_SOURCE_BYTES;

  const refBudget = useMemo(
    () => Math.max(0, PROMPT_BUDGET_BYTES - 400 - byteLength(buildKoreanPrompt({
      brand: brandFull, channel, sourceType, source, sourceFilesBlock: srcFit.block,
      imageCount: imageRefs.length, sourceImageCount: sourceImages.length,
    }))),
    [brandId, profile.en, profile.voice, channelId, sourceTypeId, source, srcFit.block, imageRefs.length, sourceImages.length],
  );
  const refFit = useMemo(() => fitReferences(refs, refBudget), [refs, refBudget]);
  const usedById = Object.fromEntries(refFit.items.map((i) => [i.id, i.used]));
  const koParsed = koGen.some((s) => s.started);
  const canGenerate = sample.status === 'ready' && sourceOk && !running && !parsing && !editing;
  const canTranslate = sample.status === 'ready' && koReady && koParsed && !running && !editing;

  // One streaming helper for both jobs. Returns the settled job state so callers can restore the previous
  // workspace when a run produced nothing (Stop while thinking, or an error before the first token).
  const stream = useCallback(async (prompt, setJobState, { fresh, images } = {}) => {
    ctlRef.current?.abort();
    const ctl = new AbortController();
    ctlRef.current = ctl;
    startedRef.current = Date.now();
    let local = { raw: '', status: 'thinking', error: null, truncated: false };
    const set = (next) => { local = next; setJobState(next); };
    set(local);
    try {
      const opts = {
        signal: ctl.signal,
        cache: fresh ? false : true,
        onText: ({ text }) => set({ ...local, raw: text, status: 'writing' }),
      };
      if (images && images.length) opts.images = images;
      const res = await sample.fn(prompt, opts);
      set({ raw: res.text, status: 'done', error: null, truncated: !!res.truncated });
    } catch (e) {
      const streamed = local.raw; // whatever onText already delivered stays on screen
      if (e && e.code === 'cancelled') {
        const raw = (e && e.text) || streamed;
        set({ raw, status: raw ? 'cancelled' : 'idle', error: null, truncated: false });
      } else {
        set({ raw: (e && e.text) || streamed, status: 'error', error: e || { code: 'unknown', message: '' }, truncated: false });
      }
    }
    return local;
  }, [sample.fn]);

  const generateKorean = async ({ fresh } = {}) => {
    if (!canGenerate) return;
    const prev = { ko, en, edits, stale, snapshot };
    setNotice(null);
    pinnedRef.current = false;
    setJob('ko'); setView('ko'); setActive(0); setEditing(null);
    setEn(EMPTY_JOB); setEdits({ ko: {}, en: {} }); setStale(false);
    setSnapshot({ fingerprint, source: source.trim(), sourceFilesBlock: srcFit.block, brand: brandFull, channelId, sourceTypeId });
    // Source images go first so they survive the per-call image cap.
    const ordered = [...sourceImages, ...imageRefs.filter((im) => im.origin !== 'source')];
    const picked = imageLimits ? ordered.slice(0, imageLimits.maxCount) : [];
    const images = picked.map((im) => im.file);
    const prompt = buildKoreanPrompt({
      brand: brandFull, channel, sourceType, source, sourceFilesBlock: srcFit.block, refsBlock: refFit.block,
      imageCount: images.length, sourceImageCount: picked.filter((im) => im.origin === 'source').length,
    });
    const final = await stream(prompt, setKo, { fresh, images });
    if (!final.raw) {
      // Nothing arrived — put the previous workspace back instead of leaving it empty.
      setKo(prev.ko); setEn(prev.en); setEdits(prev.edits); setStale(prev.stale); setSnapshot(prev.snapshot);
      setNotice(final.status === 'error'
        ? { kind: 'crit', text: `국문 생성 실패 — ${errCopy(final.error)}${prev.ko.raw ? ' 이전 결과를 유지합니다.' : ''}` }
        : { kind: 'warn', text: `국문 생성이 중단되었습니다.${prev.ko.raw ? ' 이전 결과를 유지합니다.' : ''}` });
    }
    setJob(null);
  };

  const translateEnglish = async ({ fresh } = {}) => {
    if (!canTranslate) return;
    const prev = { en, enEdits: edits.en, stale };
    setNotice(null);
    pinnedRef.current = false;
    setJob('en'); setView('en'); setActive(0); setEditing(null);
    setEdits((e) => ({ ...e, en: {} })); setStale(false);
    const snap = snapshot || { source: source.trim(), brand: brandFull, channelId, sourceTypeId };
    const snapChannel = CHANNELS.find((c) => c.id === snap.channelId) || channel;
    const snapType = SOURCE_TYPES.find((s) => s.id === snap.sourceTypeId) || sourceType;
    const present = koSections.map((s, i) => (s.started ? i : -1)).filter((i) => i >= 0);
    // The English pass needs the same facts; the Korean set is the bulk, so the source is capped here.
    const combinedSource = truncateBytes(
      [snap.source, snap.sourceFilesBlock].filter(Boolean).join('\n\n'),
      Math.max(4000, MAX_SOURCE_BYTES - byteLength(joinSections(koSections))),
    );
    const args = {
      brand: snap.brand || brandFull, channel: snapChannel, sourceType: snapType, source: combinedSource,
      koreanText: joinSections(koSections), present, partial: ko.status === 'cancelled' || ko.truncated,
    };
    const { block } = fitReferences(refs, PROMPT_BUDGET_BYTES - 400 - byteLength(buildEnglishPrompt(args)));
    const prompt = buildEnglishPrompt({ ...args, refsBlock: block });
    const final = await stream(prompt, setEn, { fresh });
    if (!final.raw) {
      setEn(prev.en); setEdits((e) => ({ ...e, en: prev.enEdits })); setStale(prev.stale);
      setNotice(final.status === 'error'
        ? { kind: 'crit', text: `영문 변환 실패 — ${errCopy(final.error)}${prev.en.raw ? ' 이전 영문을 유지합니다.' : ''}` }
        : { kind: 'warn', text: `영문 변환이 중단되었습니다.${prev.en.raw ? ' 이전 영문을 유지합니다.' : ''}` });
    }
    setJob(null);
  };

  // A double-click on the primary button would land its second click on Stop; ignore a Stop within the first moments.
  const stop = () => { if (Date.now() - startedRef.current < 600) return; ctlRef.current?.abort(); };

  const onSourceKey = (e) => {
    if (!((e.ctrlKey || e.metaKey) && e.key === 'Enter')) return;
    e.preventDefault();
    if (!canGenerate) return;
    if (!koReady) generateKorean();
    else if (inputsChanged) generateKorean({ fresh: true });
  };

  const loadExample = () => { setSource(sourceType.example); textareaRef.current?.focus(); };
  const updateProfile = (patch) => setProfiles((p) => ({ ...p, [brand.id]: { ...p[brand.id], ...patch } }));

  // Classify dropped files, parse documents to text, attach images (session only).
  // target 'source' = primary evidence (clinical data / competitor intel); 'ref' = tone & terminology reference.
  const addFiles = async (fileList, target = 'ref') => {
    const setList = target === 'source' ? setSourceFiles : setRefs;
    const files = Array.from(fileList || []);
    if (!files.length) return;
    const extOf = (n) => (n.split('.').pop() || '').toLowerCase();
    const docs = [], imgs = [], rejected = [];
    for (const f of files) {
      const ext = extOf(f.name);
      if (f.type.startsWith('image/')) {
        if (!imageLimits) rejected.push({ name: f.name, reason: '이 화면에서는 이미지 첨부를 지원하지 않습니다' });
        else if (!imageLimits.mediaTypes.includes(f.type)) rejected.push({ name: f.name, reason: '지원하지 않는 이미지 형식' });
        else if (f.size > imageLimits.maxInputBytes) rejected.push({ name: f.name, reason: `이미지가 너무 큽니다 (최대 ${fmtBytes(imageLimits.maxInputBytes)})` });
        else imgs.push(f);
      } else if (TEXT_EXTS.includes(ext) || ['pdf', 'docx', 'pptx', 'xlsx'].includes(ext) || f.type.startsWith('text/')) {
        if (f.size > MAX_REF_FILE_BYTES) rejected.push({ name: f.name, reason: `파일이 너무 큽니다 (최대 ${fmtBytes(MAX_REF_FILE_BYTES)})` });
        else docs.push(f);
      } else {
        rejected.push({ name: f.name, reason: '지원하지 않는 형식 (PDF · DOCX · PPTX · XLSX · TXT · MD · CSV · JSON)' });
      }
    }
    if (imgs.length) {
      const room = Math.max(0, imageLimits.maxCount - imageRefs.length);
      imgs.slice(room).forEach((f) => rejected.push({ name: f.name, reason: `이미지는 최대 ${imageLimits.maxCount}장까지 첨부할 수 있습니다` }));
      const take = imgs.slice(0, room);
      if (take.length) setImageRefs((prev) => [...prev, ...take.map((f) => ({ id: nextRefId(), name: f.name, size: f.size, file: f, origin: target }))]);
    }
    const entries = docs.map((f) => ({ id: nextRefId(), name: f.name, ext: extOf(f.name), size: f.size, status: 'parsing', text: '', chars: 0, bytes: 0, error: null }));
    const errors = rejected.map((r) => ({ id: nextRefId(), name: r.name, ext: extOf(r.name), size: 0, status: 'error', text: '', chars: 0, bytes: 0, error: r.reason }));
    if (entries.length || errors.length) setList((prev) => [...prev, ...entries, ...errors]);
    await Promise.all(entries.map(async (entry, i) => {
      try {
        const text = await extractText(docs[i]);
        if (!text.trim()) throw new Error('추출된 텍스트가 없습니다');
        setList((prev) => prev.map((r) => (r.id === entry.id ? { ...r, status: 'ready', text, chars: text.replace(/\s/g, '').length, bytes: byteLength(text) } : r)));
      } catch (e) {
        setList((prev) => prev.map((r) => (r.id === entry.id ? { ...r, status: 'error', error: (e && e.message) || '읽기 실패' } : r)));
      }
    }));
  };
  const removeRef = (id) => setRefs((prev) => prev.filter((r) => r.id !== id));
  const removeSourceFile = (id) => setSourceFiles((prev) => prev.filter((r) => r.id !== id));
  const removeImage = (id) => setImageRefs((prev) => prev.filter((im) => im.id !== id));
  const onDrop = (target) => (e) => { e.preventDefault(); setDragOver(null); addFiles(e.dataTransfer && e.dataTransfer.files, target); };
  const dropProps = (target) => ({
    onDragOver: (e) => { e.preventDefault(); if (dragOver !== target) setDragOver(target); },
    onDragLeave: () => setDragOver((d) => (d === target ? null : d)),
    onDrop: onDrop(target),
  });
  // Pull an extracted document into the editable source box so the PM can trim it before generating.
  const inlineSourceFile = (r) => {
    setSource((s) => (s.trim() ? `${s.trim()}\n\n` : '') + `[${r.name}]\n${r.text}`);
    removeSourceFile(r.id);
    textareaRef.current?.focus();
  };

  // Section editing (raw Markdown). Editing the Korean after English exists marks the English stale.
  const startEdit = () => setEditing({ lang: view, idx: active, text: sections[active].body, before: sections[active].body });
  const saveEdit = () => {
    if (!editing) return;
    const text = editing.text.trim();
    const generated = (editing.lang === 'ko' ? koGen : enGen)[editing.idx].body;
    setEdits((e) => {
      const next = { ...e[editing.lang] };
      if (text === generated) delete next[editing.idx]; else next[editing.idx] = text;
      return { ...e, [editing.lang]: next };
    });
    if (editing.lang === 'ko' && text !== editing.before && (enReady || en.raw)) setStale(true);
    setEditing(null);
  };
  const revertEdit = () => {
    setEdits((e) => { const next = { ...e[view] }; delete next[active]; return { ...e, [view]: next }; });
    if (view === 'ko' && (enReady || en.raw)) setStale(true);
  };

  const allText = useMemo(() => TABS.map((t, i) => sections[i].started ? `## ${view === 'ko' ? t.titleKo : t.titleEn}\n\n${sections[i].body}` : '').filter(Boolean).join('\n\n\n'), [sections, view]);
  const writingIdx = viewRunning ? sections.reduce((acc, s, i) => (s.started ? i : acc), -1) : -1;

  // Status line
  let statusLine = null;
  if (job === 'ko' && ko.status === 'thinking') statusLine = <span className="text-ink-2">Claude가 원천 정보를 읽고 있습니다<span className="pulse">…</span></span>;
  else if (job === 'ko') statusLine = <span className="text-ink-2">국문 작성 중 · 섹션 <span className="font-mono">{Math.max(koSections.filter((s) => s.started).length, 1)}/4</span></span>;
  else if (job === 'en' && en.status === 'thinking') statusLine = <span className="text-ink-2">국문 자료를 영문으로 옮기고 있습니다<span className="pulse">…</span></span>;
  else if (job === 'en') statusLine = <span className="text-ink-2">영문 변환 중 · 섹션 <span className="font-mono">{Math.max(enSections.filter((s) => s.started).length, 1)}/4</span></span>;
  else if (notice) statusLine = <span className={notice.kind === 'crit' ? 'text-crit' : 'text-warn'}>{notice.text}</span>;
  else if (ko.status === 'error') statusLine = <span className="text-crit">{errCopy(ko.error)} 여기까지 작성된 내용은 유지됩니다.</span>;
  else if (en.status === 'error') statusLine = <span className="text-crit">영문 변환 실패 — {errCopy(en.error)}</span>;
  else if (ko.raw && !koParsed && !running) statusLine = <span className="text-crit">출력 형식을 인식하지 못했습니다(섹션 헤더 없음). 원문은 탭에 표시됩니다 — 국문 다시 생성을 눌러 주세요.</span>;
  else if (sample.status === 'unavailable') statusLine = <span className="text-warn">이 화면에서는 Claude를 사용할 수 없습니다. claude.ai에서 열면 생성 기능이 켜집니다.</span>;
  else if (sample.status === 'connecting') statusLine = <span className="text-ink-3">Claude 연결 중<span className="pulse">…</span></span>;
  else if (parsing) statusLine = <span className="text-ink-3">참고 자료를 읽는 중<span className="pulse">…</span></span>;
  else if (koReady && stale) statusLine = <span className="text-warn">국문이 수정되었습니다 — 최신 국문 기준으로 영문을 다시 변환하세요.</span>;
  else if (koReady && inputsChanged) statusLine = <span className="text-warn">입력이 변경되었습니다 — 다시 생성하면 반영됩니다.</span>;
  else if (ko.status === 'cancelled' && !enReady) statusLine = <span className="text-warn">국문 생성 중단됨 · 여기까지 작성된 내용을 유지합니다</span>;
  else if (en.status === 'cancelled') statusLine = <span className="text-warn">영문 변환 중단됨 · 여기까지 작성된 내용을 유지합니다</span>;
  else if (koReady && enReady) statusLine = <span className="text-ink-2">국문 · 영문 완료 — 상단에서 언어를 전환하세요.</span>;
  else if (koReady) statusLine = <span className="text-ink-2">국문 완료 · <span className="font-mono">{charCount(ko.raw).toLocaleString()}</span>자 — 검수·편집 후 영문으로 변환하세요.</span>;
  else if (!hasSource) statusLine = <span className="text-ink-3">원천 정보를 입력하거나 원천 파일을 올리면 국문 자료를 먼저 생성합니다.</span>;
  else statusLine = <span className="text-ink-3">{brand.name} · {channel.name} · {sourceType.name}</span>;

  const tab = TABS[active];
  const sec = sections[active];
  const isEditingHere = editing && editing.lang === view && editing.idx === active;
  const enPreview = view === 'en' && !en.raw && job !== 'en';
  const focusInset = 'focus-visible:outline-offset-[-2px]';

  return (
    <div className="min-h-screen bg-ground text-ink">
      <header className="h-14 border-b border-line bg-surface flex items-center justify-between px-5 gap-4">
        <div className="flex items-baseline gap-3 min-w-0">
          <span className="font-mono text-[10.5px] tracking-[0.18em] uppercase text-ink-3 shrink-0">KO → EN</span>
          <h1 className="font-display font-medium text-[21px] leading-none text-ink truncate">Marketing Material Generator</h1>
        </div>
        <StatusPill status={sample.status} />
      </header>

      <main className="workspace grid grid-cols-1 lg:grid-cols-[300px_minmax(0,1fr)_minmax(0,1.15fr)]">
        {/* ── Left rail: brand & channel ── */}
        <aside className="border-b lg:border-b-0 lg:border-r border-line bg-surface lg:overflow-y-auto">
          <div className="p-5 flex flex-col gap-7">
            <section>
              <Eyebrow>자사 브랜드</Eyebrow>
              <div role="radiogroup" aria-label="브랜드" className="border border-line rounded-sm divide-y divide-line">
                {BRANDS.map((b) => {
                  const sel = b.id === brandId;
                  return (
                    <button key={b.id} type="button" role="radio" aria-checked={sel} onClick={() => setBrandId(b.id)}
                      className={`w-full text-left px-4 py-3 flex items-center justify-between gap-3 transition-colors ${sel ? 'bg-surface-2' : 'hover:bg-surface-2'}`}>
                      <span className="min-w-0">
                        <span className={`block font-display text-[19px] leading-tight ${sel ? 'text-ink' : 'text-ink-2'}`}>{b.name}</span>
                        <span className="block font-mono text-[10.5px] tracking-[0.12em] text-ink-3 mt-0.5">{profiles[b.id].en.toUpperCase()}</span>
                      </span>
                      <Radio checked={sel} />
                    </button>
                  );
                })}
              </div>

              <button type="button" onClick={() => setVoiceOpen((v) => !v)} aria-expanded={voiceOpen}
                className="mt-3 inline-flex items-center gap-1.5 text-[12px] text-ink-2 hover:text-ink">
                <svg width="10" height="10" viewBox="0 0 10 10" className={`transition-transform ${voiceOpen ? 'rotate-90' : ''}`} aria-hidden="true"><path d="M3 1.5L7 5 3 8.5" fill="none" stroke="currentColor" strokeWidth="1.3" /></svg>
                {brand.name} 브랜드 보이스 편집
              </button>
              {voiceOpen && (
                <div className="mt-3 flex flex-col gap-3">
                  <label className="block">
                    <span className="block font-mono text-[10.5px] tracking-[0.12em] uppercase text-ink-3 mb-1">English brand name</span>
                    <input value={profile.en} onChange={(e) => updateProfile({ en: e.target.value })}
                      className="w-full h-9 px-3 border border-line rounded-sm bg-surface-2 text-[13px] focus:border-ink" />
                  </label>
                  <label className="block">
                    <span className="block font-mono text-[10.5px] tracking-[0.12em] uppercase text-ink-3 mb-1">Brand voice (English, sent with the prompt)</span>
                    <textarea value={profile.voice} rows={4} onChange={(e) => updateProfile({ voice: e.target.value })}
                      className="w-full p-3 border border-line rounded-sm bg-surface-2 text-[13px] leading-relaxed focus:border-ink" />
                  </label>
                  <p className="text-[11.5px] text-ink-3 leading-relaxed">초기값은 톤 가이드 예시입니다. 실제 브랜드 가이드라인에 맞춰 수정하면 이 브라우저에 저장됩니다.</p>
                </div>
              )}
            </section>

            <section>
              <Eyebrow>타겟 채널</Eyebrow>
              <div role="radiogroup" aria-label="타겟 채널" className="border border-line rounded-sm divide-y divide-line">
                {CHANNELS.map((c) => {
                  const sel = c.id === channelId;
                  return (
                    <button key={c.id} type="button" role="radio" aria-checked={sel} onClick={() => setChannelId(c.id)}
                      className={`w-full text-left px-4 py-3 flex items-start justify-between gap-3 transition-colors ${sel ? 'bg-surface-2' : 'hover:bg-surface-2'}`}>
                      <span className="min-w-0">
                        <span className={`block text-[14px] font-semibold leading-tight ${sel ? 'text-ink' : 'text-ink-2'}`}>{c.name}</span>
                        <span className="block text-[12px] text-ink-2 mt-1">{c.audience}</span>
                        <span className="block text-[11.5px] text-ink-3 mt-0.5 leading-relaxed">{c.desc}</span>
                      </span>
                      <span className="pt-0.5"><Radio checked={sel} /></span>
                    </button>
                  );
                })}
              </div>
              <p className="mt-3 text-[11.5px] text-ink-3 leading-relaxed">선택한 채널에 맞춰 핵심 메시지가 최적화되고, 나머지 세 산출물은 각자의 독자에 맞게 조정됩니다.</p>
            </section>

            <section>
              <Eyebrow>작업 흐름</Eyebrow>
              <ol className="text-[12px] text-ink-2 leading-relaxed flex flex-col gap-1.5">
                <li className="flex gap-2"><span className="font-mono text-ink-3 shrink-0">1</span><span>원천 정보를 <b className="font-semibold text-ink">입력하거나 파일로 올리고</b> 국문 생성 — 국내용 초안</span></li>
                <li className="flex gap-2"><span className="font-mono text-ink-3 shrink-0">2</span><span>탭별로 검수하고 필요하면 <b className="font-semibold text-ink">편집</b></span></li>
                <li className="flex gap-2"><span className="font-mono text-ink-3 shrink-0">3</span><span><b className="font-semibold text-ink">영문 변환</b> — 검수된 국문 기준으로 해외용 세트 생성</span></li>
              </ol>
            </section>
          </div>
        </aside>

        {/* ── Center: source input & references ── */}
        <section className="border-b lg:border-b-0 lg:border-r border-line bg-ground flex flex-col min-h-[460px] lg:min-h-0 lg:overflow-y-auto">
          <div className="px-5 pt-5 pb-3">
            <Eyebrow right={
              <div role="radiogroup" aria-label="원천 정보 유형" className="inline-flex border border-line rounded-sm overflow-hidden bg-surface">
                {SOURCE_TYPES.map((s) => {
                  const sel = s.id === sourceTypeId;
                  return (
                    <button key={s.id} type="button" role="radio" aria-checked={sel} onClick={() => setSourceTypeId(s.id)}
                      className={`h-7 px-3 text-[12px] transition-colors ${focusInset} ${sel ? 'bg-ink text-ground' : 'text-ink-2 hover:text-ink'}`}>
                      {s.name}
                    </button>
                  );
                })}
              </div>
            }>원천 정보 · Source</Eyebrow>
            <p className="text-[12.5px] text-ink-2 leading-relaxed">{sourceType.hint}</p>
          </div>

          <div className="flex-1 min-h-0 px-5" {...dropProps('source')}>
            <textarea ref={textareaRef} value={source} onChange={(e) => setSource(e.target.value)} onKeyDown={onSourceKey}
              placeholder={sourceType.placeholder} spellCheck={false} aria-label="원천 정보"
              className={`w-full h-full min-h-[180px] p-4 border rounded-sm bg-surface text-[14px] leading-[1.65] placeholder:text-ink-3 focus:border-ink ${dragOver === 'source' ? 'border-accent' : 'border-line'}`} />
          </div>

          <div className="px-5 py-3 flex items-center justify-between gap-3 flex-wrap">
            <div className="flex items-center gap-3 text-[12px]">
              <span className={`font-mono ${sourceBytes > MAX_SOURCE_BYTES ? 'text-crit' : 'text-ink-3'}`}>{source.length.toLocaleString()}자 · {fmtBytes(sourceTotalBytes)} / {fmtBytes(MAX_SOURCE_BYTES)}</span>
              {sourceBytes > MAX_SOURCE_BYTES && <span className="text-crit">너무 깁니다 — 핵심만 남겨 주세요</span>}
              <span className="hidden sm:inline text-ink-3">Ctrl + Enter로 국문 생성</span>
            </div>
            <div className="flex items-center gap-2">
              <Btn onClick={loadExample}>예시 불러오기</Btn>
              <Btn variant="text" onClick={() => setSource('')} disabled={!source}>지우기</Btn>
            </div>
          </div>

          {/* Source documents: the clinical / competitor originals themselves */}
          <div className="px-5 pb-4" {...dropProps('source')}>
            <div className={`border border-dashed rounded-sm px-4 py-3 flex items-center justify-between gap-3 flex-wrap transition-colors ${dragOver === 'source' ? 'border-accent bg-accent-soft' : 'border-line-strong bg-surface'}`}>
              <div className="text-[12.5px] text-ink-2 leading-relaxed min-w-0 flex-1">
                {sourceType.id === 'clinical' ? '임상 보고서·통계 표·발표 자료' : '경쟁사 리포트·전시회 메모·가격표'} 원본을 올리면 직접 입력한 내용과 함께 <b className="font-semibold text-ink">1차 자료</b>로 읽습니다.
                <span className="block text-[11.5px] text-ink-3 mt-0.5">수치는 파일에서 그대로 인용하며, 입력창을 비워 두고 파일만 올려도 됩니다.</span>
              </div>
              <div className="shrink-0">
                <input ref={sourceInputRef} type="file" multiple accept={acceptList} className="hidden" aria-label="원천 자료 파일 선택"
                  onChange={(e) => { addFiles(e.target.files, 'source'); e.target.value = ''; }} />
                <Btn onClick={() => sourceInputRef.current && sourceInputRef.current.click()}>원천 파일 올리기</Btn>
              </div>
            </div>
            {(sourceFiles.length > 0 || sourceImages.length > 0) && (
              <ul className="mt-2 flex flex-col gap-1 max-h-[168px] overflow-y-auto pr-0.5">
                {sourceFiles.map((r) => (
                  <FileRow key={r.id} file={r} used={srcUsedById[r.id] || 0} onRemove={removeSourceFile} onInline={inlineSourceFile} />
                ))}
                {sourceImages.map((im) => (
                  <li key={im.id} className="flex items-center gap-3 h-9 px-3 border border-line rounded-sm bg-surface text-[12px]">
                    <span className="font-mono text-[10px] tracking-wider text-accent w-10 shrink-0">IMG</span>
                    <span className="truncate min-w-0 flex-1 text-ink" title={im.name}>{im.name}</span>
                    <span className="font-mono text-[11px] text-ink-3 shrink-0">{fmtBytes(im.size)} · 원천 이미지</span>
                    <button type="button" onClick={() => removeImage(im.id)} aria-label={`${im.name} 제거`} className="shrink-0 text-ink-3 hover:text-ink px-1 text-[14px] leading-none">×</button>
                  </li>
                ))}
              </ul>
            )}
          </div>

          {/* Reference materials: parsed in the browser, budgeted into the prompt */}
          <div className="px-5 pb-5 pt-4 border-t border-line">
            <Eyebrow right={
              <span className="text-[11.5px] text-ink-3 font-mono">
                {readyRefs.length > 0
                  ? `문서 ${readyRefs.length} · 프롬프트 여유 ${fmtBytes(refBudget)}`
                  : '선택 사항 — 톤·용어 참고용'}
              </span>
            }>참고 자료 · References</Eyebrow>
            <div {...dropProps('ref')}
              className={`border border-dashed rounded-sm px-4 py-3 flex items-center justify-between gap-3 flex-wrap transition-colors ${dragOver === 'ref' ? 'border-accent bg-accent-soft' : 'border-line-strong bg-surface'}`}>
              <div className="text-[12.5px] text-ink-2 leading-relaxed min-w-0 flex-1">
                브랜드 가이드, 기존 카피, 용어집처럼 <b className="font-semibold text-ink">톤·용어를 맞출 자료</b>를 올립니다. 사실의 출처는 위 원천 정보입니다.
                <span className="block text-[11.5px] text-ink-3 mt-0.5">
                  PDF · DOCX · PPTX · XLSX · TXT · MD · CSV · JSON{imageLimits ? ` · 이미지 최대 ${imageLimits.maxCount}장` : ''} — 파일은 이 브라우저 안에서만 읽습니다.
                </span>
              </div>
              <div className="shrink-0">
                <input ref={fileInputRef} type="file" multiple accept={acceptList} className="hidden" aria-label="참고 자료 파일 선택"
                  onChange={(e) => { addFiles(e.target.files, 'ref'); e.target.value = ''; }} />
                <Btn onClick={() => fileInputRef.current && fileInputRef.current.click()}>파일 선택</Btn>
              </div>
            </div>

            {(refs.length > 0 || imageRefs.some((im) => im.origin !== 'source')) && (
              <ul className="mt-2 flex flex-col gap-1 max-h-[168px] overflow-y-auto pr-0.5">
                {refs.map((r) => <FileRow key={r.id} file={r} used={usedById[r.id] || 0} onRemove={removeRef} />)}
                {imageRefs.filter((im) => im.origin !== 'source').map((im) => (
                  <li key={im.id} className="flex items-center gap-3 h-9 px-3 border border-line rounded-sm bg-surface text-[12px]">
                    <span className="font-mono text-[10px] tracking-wider text-clinical w-10 shrink-0">IMG</span>
                    <span className="truncate min-w-0 flex-1 text-ink" title={im.name}>{im.name}</span>
                    <span className="font-mono text-[11px] text-ink-3 shrink-0">{fmtBytes(im.size)} · 국문 생성 시 첨부</span>
                    <button type="button" onClick={() => removeImage(im.id)} aria-label={`${im.name} 제거`} className="shrink-0 text-ink-3 hover:text-ink px-1 text-[14px] leading-none">×</button>
                  </li>
                ))}
              </ul>
            )}
            {imageRefs.length > 0 && <p className="mt-1.5 text-[11.5px] text-ink-3">이미지는 이 세션에서만 유지됩니다. 새로고침하면 다시 첨부하세요.{imageLimits && imageRefs.length > imageLimits.maxCount ? ` 한 번에 ${imageLimits.maxCount}장까지 전달되며, 원천 이미지가 우선합니다.` : ''}</p>}
          </div>
        </section>

        {/* ── Right: generate, translate & outputs ── */}
        <section className="bg-surface flex flex-col min-h-[560px] lg:min-h-0">
          <div className="px-5 pt-4 pb-3 border-b border-line flex items-center gap-3 flex-wrap">
            {running ? (
              <Btn variant="stop" onClick={stop}><span className="w-2 h-2 bg-ink" aria-hidden="true" /> Stop</Btn>
            ) : !koReady ? (
              <Btn variant="primary" onClick={() => generateKorean()} disabled={!canGenerate}>국문 생성 <span aria-hidden="true">→</span></Btn>
            ) : !enReady || stale ? (
              <Btn variant="primary" onClick={() => translateEnglish({ fresh: stale })} disabled={!canTranslate}>{stale ? '영문 다시 변환' : '영문 변환'} <span aria-hidden="true">→</span></Btn>
            ) : (
              <Btn variant="outline" onClick={() => translateEnglish({ fresh: true })} disabled={!canTranslate}>영문 다시 변환</Btn>
            )}
            <div className="text-[12.5px] min-w-0 flex-1">{statusLine}</div>
            {!running && koReady && (
              <div className="flex items-center gap-2">
                <Btn onClick={() => generateKorean({ fresh: true })} disabled={!canGenerate}>국문 다시 생성</Btn>
                <CopyButton text={allText} label={view === 'ko' ? '국문 전체 복사' : '영문 전체 복사'} />
              </div>
            )}
          </div>

          {current.truncated && (
            <div className="px-5 py-2 text-[12px] text-warn bg-warn-soft border-b border-line">출력이 길이 제한으로 잘렸습니다. 원천 정보나 참고 자료를 줄인 뒤 다시 생성하세요.</div>
          )}

          <div className="px-5 border-b border-line flex items-center justify-between gap-3">
            <div role="tablist" aria-label="산출물" className="flex gap-1 overflow-x-auto overflow-y-hidden min-w-0 self-stretch">
              {TABS.map((t, i) => {
                const s = sections[i];
                const isActive = i === active;
                const isWriting = viewRunning && i === writingIdx;
                return (
                  <button key={t.id} type="button" role="tab" aria-selected={isActive} aria-controls={`panel-${t.id}`} id={`tab-${t.id}`}
                    onClick={() => { pinnedRef.current = true; setActive(i); setEditing(null); }}
                    className={`relative shrink-0 flex items-center gap-2 h-11 px-3 text-[13px] border-b-2 transition-colors ${focusInset} ${isActive ? 'border-accent text-ink font-medium' : 'border-transparent text-ink-3 hover:text-ink-2'}`}>
                    <span className={`inline-flex items-center justify-center w-[18px] h-[18px] rounded-full font-mono text-[10.5px] ${s.started ? (isActive ? 'bg-accent text-accent-ink' : 'bg-accent-soft text-accent') : 'border border-line-strong text-ink-3'}`}>{t.num}</span>
                    {t.label}
                    {isWriting && <span className="w-1.5 h-1.5 rounded-full bg-accent pulse" aria-label="작성 중" />}
                    {!isWriting && s.started && s.complete && <Check className="text-good" />}
                    {s.edited && <span className="font-mono text-[9.5px] tracking-wider text-warn" title="편집됨">EDIT</span>}
                  </button>
                );
              })}
            </div>
            <div role="radiogroup" aria-label="언어" className="inline-flex shrink-0 border border-line rounded-sm overflow-hidden bg-surface-2 my-2">
              {['ko', 'en'].map((l) => {
                const sel = view === l;
                const st = l === 'ko' ? ko : en;
                const has = !!st.raw;
                const busy = job === l;
                return (
                  <button key={l} type="button" role="radio" aria-checked={sel} onClick={() => { setView(l); setEditing(null); pinnedRef.current = false; }}
                    className={`h-7 px-3 text-[12px] inline-flex items-center gap-1.5 transition-colors ${focusInset} ${sel ? 'bg-ink text-ground' : 'text-ink-2 hover:text-ink'}`}>
                    {LANGS[l].label}
                    {busy ? <span className={`w-1.5 h-1.5 rounded-full pulse ${sel ? 'bg-ground' : 'bg-accent'}`} /> : has ? <Check /> : <span className={`font-mono text-[9.5px] ${sel ? 'text-ground' : 'text-ink-3'}`}>{l === 'en' ? '미변환' : '미생성'}</span>}
                  </button>
                );
              })}
            </div>
          </div>

          {view === 'en' && stale && en.raw && (
            <div className="px-5 py-2 text-[12px] text-warn bg-warn-soft border-b border-line flex items-center justify-between gap-3">
              <span>국문이 수정된 뒤의 영문이 아닙니다. 최신 국문 기준으로 다시 변환하세요.</span>
              <Btn onClick={() => translateEnglish({ fresh: true })} disabled={!canTranslate}>영문 다시 변환</Btn>
            </div>
          )}

          <div id={`panel-${tab.id}`} role="tabpanel" aria-labelledby={`tab-${tab.id}`} className="flex-1 min-h-0 overflow-y-auto">
            <div className="px-6 py-6 max-w-[72ch]">
              <div className="flex items-end justify-between gap-4 mb-5">
                <div>
                  <div className="font-mono text-[10.5px] tracking-[0.16em] uppercase text-ink-3">Output {tab.num} of 4 · {view === 'ko' ? '국문 · 국내용' : 'English · 해외용'}</div>
                  <h2 className="font-display text-[24px] leading-tight mt-1" style={{ textWrap: 'balance' }} lang={view}>{view === 'ko' ? tab.titleKo : tab.titleEn}</h2>
                </div>
                <div className="flex items-center gap-2 shrink-0">
                  {sec.started && !isEditingHere && <span className="font-mono text-[11px] text-ink-3 mr-1">{lengthLabel(sec.body, view)}</span>}
                  {sec.started && !isEditingHere && sec.complete && !running && <Btn onClick={startEdit}>편집</Btn>}
                  {!isEditingHere && <CopyButton text={sec.body} />}
                </div>
              </div>

              {isEditingHere ? (
                <div className="flex flex-col gap-3">
                  <textarea value={editing.text} onChange={(e) => setEditing({ ...editing, text: e.target.value })} spellCheck={false}
                    aria-label={`${view === 'ko' ? tab.titleKo : tab.titleEn} 편집`}
                    className="editor w-full min-h-[360px] p-4 border border-ink rounded-sm bg-surface-2" lang={view} />
                  <div className="flex items-center justify-between gap-3 flex-wrap">
                    <span className="text-[12px] text-ink-3">마크다운 그대로 편집합니다(### 소제목, - 불릿, **굵게**). {view === 'ko' && (enReady || en.raw) ? '저장하면 영문을 다시 변환해야 합니다.' : ''}</span>
                    <div className="flex items-center gap-2">
                      <Btn variant="text" onClick={() => setEditing(null)}>취소</Btn>
                      <Btn variant="primarySmall" onClick={saveEdit}>저장</Btn>
                    </div>
                  </div>
                </div>
              ) : current.raw && !running && !sections.some((s) => s.started) ? (
                <div className="flex flex-col gap-4">
                  <div className="border border-crit rounded-sm bg-crit-soft px-4 py-3 text-[12.5px] text-crit leading-relaxed">
                    생성된 텍스트에서 섹션 헤더(<span className="font-mono">## [1] KEY MESSAGES</span> …)를 찾지 못해 탭으로 나누지 못했습니다. 아래 원문을 확인하고 <b className="font-semibold">{view === 'ko' ? '국문 다시 생성' : '영문 다시 변환'}</b>을 눌러 주세요.
                  </div>
                  <div className="flex items-center justify-end"><CopyButton text={current.raw} label="원문 복사" /></div>
                  <CopyBody body={current.raw} hashtags={false} streaming={false} lang={view} />
                </div>
              ) : sec.started ? (
                <>
                  {sec.edited && (
                    <div className="mb-4 flex items-center justify-between gap-3 text-[12px] text-warn">
                      <span>편집된 버전입니다.</span>
                      <Btn variant="text" onClick={revertEdit}>생성 원본으로 되돌리기</Btn>
                    </div>
                  )}
                  <CopyBody body={sec.body} hashtags={tab.id === 'insta'} streaming={viewRunning && !sec.complete} lang={view} />
                </>
              ) : viewRunning ? (
                <div className="flex flex-col gap-3" aria-live="polite" aria-label="작성 대기 중">
                  <div className="skeleton h-4 w-3/4" /><div className="skeleton h-4 w-full" /><div className="skeleton h-4 w-5/6" />
                  <div className="h-2" />
                  <div className="skeleton h-4 w-2/3" /><div className="skeleton h-4 w-11/12" /><div className="skeleton h-4 w-1/2" />
                  <p className="text-[12.5px] text-ink-3 mt-2">{current.status === 'thinking' ? '첫 문장이 나오기까지 보통 5–60초 걸립니다.' : '앞 섹션을 먼저 작성하고 있습니다.'}</p>
                </div>
              ) : enPreview ? (
                <div className="border border-dashed border-line-strong rounded-sm p-5 flex flex-col gap-4">
                  <p className="text-[13px] text-ink-2 leading-relaxed">
                    {koReady
                      ? '검수된 국문 자료를 기준으로 해외용 영문 세트를 만듭니다. 사실과 수치는 그대로 유지하고, 표현은 현지 마케터가 승인할 수 있는 영어로 옮기며 해외 시장용 클레임 규칙을 적용합니다.'
                      : '먼저 국문 자료를 생성하면, 검수 후 이 자리에서 해외용 영문 세트로 변환할 수 있습니다.'}
                  </p>
                  {koReady && <div><Btn variant="primary" onClick={() => translateEnglish()} disabled={!canTranslate}>영문 변환 <span aria-hidden="true">→</span></Btn></div>}
                  {en.status === 'error' && <p className="text-[12.5px] text-crit">{errCopy(en.error)}</p>}
                </div>
              ) : (
                <div className="border border-dashed border-line-strong rounded-sm p-5">
                  <p className="text-[13px] text-ink-2 leading-relaxed">{tab.empty}</p>
                  {current.status === 'error' && <p className="text-[12.5px] text-crit mt-3">{errCopy(current.error)}</p>}
                </div>
              )}
            </div>
          </div>
        </section>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
